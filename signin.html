<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Porsche 911 Sign In</title>
    <link rel="stylesheet" href="styles/styles.css">
</head>

<body>

    <header>

        <nav class="nav-box">
            <a href="index.html">Home</a>
            <span>|</span>
            <a href="features.html">Features</a>
        </nav>

    </header>

    <main class="sign-in">

        <form id="signInForm">

            <h1 class="sign-in-text">Sign In</h1>

            <div class="sign-in-input">
                <span>E-Mail: </span><input class="email" id="userEmail" type="email" placeholder="Your E-Mail">
                <br>
                <span>Password: </span><input id="userPassword" type="password" size="16" placeholder="Your Password">
            </div>

            <a class="sign-up-redirect" href="signup.html">Not signed up yet?</a>

            <div class="sign-in-text">
                <button>Sign In</button>
            </div>

        </form>

        <script src="scripts/auth.js"></script>

    </main>

</body>

</html>
