<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="zig-zag.css">
</head>


<div class="container">

    <!-- Row 1: Left Picture, Right Text -->
    <div class="row">
      <div class="media">
        <img src="https://via.placeholder.com/400x300" alt="Sample picture 1">
      </div>
      <div class="text">
        <h2>First Heading</h2>
        <p>This is the text on the right side of the first picture.</p>
      </div>
    </div>
  
    <!-- Row 2: Left Text, Right Picture -->
    <div class="row.reverse">
      <div class="media">
        <img src="https://via.placeholder.com/400x300" alt="Sample picture 2">
      </div>
      <div class="text">
        <h2>Second Heading</h2>
        <p>This text is on the left side of the second picture.</p>
      </div>
    </div>
  
  </div>

</html>
